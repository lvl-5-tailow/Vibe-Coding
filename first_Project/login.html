<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ESPADA</title>
    <meta name="description" content="Sign in to ESPADA, your intelligent educational AI tutor.">
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">



    <!-- LOGIN CONTENT -->

    <div class="login-page">
        <div class="login-card">

            <div class="login-card__header">
                <img src="resources/icons/main_icon.png" alt="ESPADA Logo" class="login-card__logo">
                <h1 class="login-card__title">Welcome back</h1>
                <p class="login-card__subtitle">Sign in to continue to ESPADA</p>
            </div>

            <form class="login-form" id="login-form" novalidate>

                <div class="form-field">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" placeholder="you@example.com" autocomplete="email"
                        required>
                </div>

                <div class="form-field">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" placeholder="••••••••"
                        autocomplete="current-password" required>
                </div>

                <a href="#" class="forgot-link" id="forgot-password-link">Forgot password?</a>

                <p class="login-error" id="login-error">Invalid email or password. Please try again.</p>

                <button type="submit" class="login-btn" id="login-submit-btn">Sign in</button>

            </form>

            <div class="login-divider">or</div>

            <div class="login-card__footer">
                Don't have an account? <a href="register.html" id="signup-link">Sign up</a>
            </div>

        </div>
    </div>

    <script src="script.js" defer></script>
</body>

</html>
